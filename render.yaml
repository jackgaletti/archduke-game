# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: archduke-game
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.1
      - key: NODE_ENV
        value: production
      - key: HOST_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: PERSISTENCE
        value: memory
      - key: DATA_DIR
        value: ./data
      - key: MATCH_DELAY_MS
        value: "1000"
